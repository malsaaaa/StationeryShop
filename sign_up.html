<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-lang-key="signup_page_title">Sign Up</title>
    <link rel="icon" href="/images/maxlida.png" />
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />
    <script src="language.js"></script>
    <style>
      /* Language dropdown styles */
      .language-dropdown {
        position: relative;
        display: inline-block;
        margin-right: 15px;
      }
      
      .language-toggle {
        display: flex;
        align-items: center;
        color: #333;
        text-decoration: none;
        padding: 5px;
      }
      
      .language-toggle .fas {
        margin-right: 5px;
      }
      
      .language-options {
        display: none;
        position: absolute;
        background-color: white;
        min-width: 160px;
        box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
        z-index: 1;
        border-radius: 4px;
        overflow: hidden;
      }
      
      .language-dropdown:hover .language-options {
        display: block;
      }
      
      .language-option {
        color: #333;
        padding: 12px 16px;
        text-decoration: none;
        display: block;
        transition: background-color 0.2s;
      }
      
      .language-option:hover {
        background-color: #f1f1f1;
      }
      
      .language-option.active {
        background-color: #e6f7ff;
        font-weight: bold;
      }
      
      /* Sign Up page specific styles */
      .signup-container {
        display: flex;
        min-height: 100vh;
        background-color: #1a73e8;
      }
      .signup-branding {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
        padding: 2rem;
        text-align: center;
      }
      .signup-branding img {
        width: 180px;
        margin-bottom: 2rem;
      }
      .signup-branding h2 {
        font-size: 1.8rem;
        margin-bottom: 1rem;
        font-weight: 400;
      }
      .signup-form-container {
        flex: 1;
        background-color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 2rem;
      }
      .signup-form {
        width: 100%;
        max-width: 400px;
        padding: 2rem;
        border-radius: 8px;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.05);
      }
      .signup-form h1 {
        margin-bottom: 1.5rem;
        font-size: 1.5rem;
        color: #333;
      }
      .signup-form input {
        width: 100%;
        padding: 12px;
        margin-bottom: 1rem;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 1rem;
      }
      .signup-form input:focus {
        outline: none;
        border-color: #1a73e8;
      }
      .signup-form button {
        width: 100%;
        padding: 12px;
        background-color: #1a73e8;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 1rem;
        cursor: pointer;
        margin-bottom: 1rem;
        text-transform: uppercase;
        font-weight: bold;
      }
      .signup-form button:hover {
        background-color: #1a73e8;
      }
      .login-link {
        text-align: center;
        margin-top: 1.5rem;
      }
      .login-link a {
        color: #1a73e8;
        text-decoration: none;
        font-weight: bold;
      }
      .header-signup {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem;
        background-color: white;
      }
      .header-signup .logo {
        display: flex;
        align-items: center;
      }
      .header-signup .logo img {
        height: 30px;
        margin-right: 5px;
      }
      .header-signup .logo span {
        color: #1a73e8;
        font-weight: bold;
        font-size: 1.2rem;
      }
      .header-signup a {
        color: #666;
        text-decoration: none;
        font-size: 0.9rem;
      }
      @media (max-width: 768px) {
        .signup-container {
          flex-direction: column;
        }
        .signup-branding {
          padding: 2rem 1rem;
        }
        .signup-form-container {
          padding: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <!-- Simple Header -->
    <div class="header-signup">
      <div class="logo">
        <a href="index.html"
          ><img src="images/maxlida.png" alt="MAXLIDA Logo"
        /></a>
        <span data-lang-key="shop_name">MAXLIDA Stationery</span>
      </div>
      <div class="top-nav-right">
        <!-- Language Dropdown -->
        <div class="language-dropdown">
          <a href="#" class="language-toggle">
            <i class="fas fa-globe"></i>
            <span class="current-lang">English</span>
          </a>
          <div class="language-options">
            <a href="#" class="language-option" data-lang="english">English</a>
            <a href="#" class="language-option" data-lang="malay">Bahasa Melayu</a>
          </div>
        </div>
        <a href="login.html" data-lang-key="login">Login</a>
      </div>
    </div>

    <!-- Sign Up Container -->
    <div class="signup-container">
      <!-- Left Side - Branding -->
      <div class="signup-branding">
        <img src="images/maxlida.png" alt="MAXLIDA Logo" />
        <h2 data-lang-key="signup_tagline">Join MAXLIDA Stationery</h2>
        <p data-lang-key="signup_description">
          Create your account to enjoy quality stationery products!
        </p>
      </div>

      <!-- Right Side - Sign Up Form -->
      <div class="signup-form-container">
        <div class="signup-form">
          <h1 data-lang-key="sign_up">Sign Up</h1>
          <form id="signupForm">
            <input
              id="signup-username"
              type="text"
              placeholder="Email/Username/Phone"
              data-lang-key="login_placeholder"
              data-lang-attr="placeholder"
              required
            />
            <input
              id="signup-password"
              type="password"
              placeholder="Password"
              data-lang-key="password_placeholder"
              data-lang-attr="placeholder"
              required
            />
            <button type="submit" data-lang-key="sign_up_button">
              SIGN UP
            </button>
          </form>
          <div class="login-link">
            <span data-lang-key="already_have_account"
              >Already have an account?</span
            >
            <a href="login.html" data-lang-key="login">Login</a>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer>
      <div class="container" style="text-align: center">
        <div class="footer-bottom" style="text-align: center; margin-top: 20px">
          <p>
            &copy; 2025 MAXLIDA Stationery Shop.
            <span data-lang-key="all_rights_reserved">All Rights Reserved</span
            >.
          </p>
        </div>
      </div>
    </footer>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // Language update (if you have translations)
        const currentLang = localStorage.getItem("language") || "english";
        if (typeof updateLanguage === "function") updateLanguage(currentLang);

        // Handle sign up form submission
        document
          .getElementById("signupForm")
          .addEventListener("submit", function (e) {
            e.preventDefault();
            const username = document.getElementById("signup-username").value;
            const password = document.getElementById("signup-password").value;

            // Get existing users or create new array
            const users = JSON.parse(localStorage.getItem("users")) || [];

            // Check if username already exists
            const exists = users.some((user) => user.username === username);
            if (exists) {
              alert("Username already exists!");
              return;
            }

            // Add new user
            users.push({ username, password });
            localStorage.setItem("users", JSON.stringify(users));

            alert("Sign up successful! You can now log in.");
            window.location.href = "login.html";
          });
      });

      // Language switching function (dummy fallback)
      function updateLanguage(lang) {
        // This function should be defined in language.js
      }
    </script>
  </body>
</html>
